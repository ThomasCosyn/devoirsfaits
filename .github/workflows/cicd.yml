name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q app cli

      - name: Importer l'application
        env:
          SECRET_KEY: ci-dummy
        run: python -c "import app.main; import app.llm; import app.routes.chat; print('imports ok')"

      - name: Vérifier la syntaxe JS
        run: |
          for f in app/static/*.js; do node --check "$f"; done

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au Container Registry Scaleway
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: scaleway
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            rg.fr-par.scw.cloud/${{ secrets.SCALEWAY_REGISTRY_NAMESPACE }}/app:latest
            rg.fr-par.scw.cloud/${{ secrets.SCALEWAY_REGISTRY_NAMESPACE }}/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redéployer le Serverless Container
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: ${{ vars.SCALEWAY_REGION || 'fr-par' }}
        run: |
          curl -o /usr/local/bin/scw https://github.com/scaleway/scaleway-cli/releases/latest/download/scw-linux-x86_64
          chmod +x /usr/local/bin/scw
          CONTAINER_ID="$(scw container container list -o json | jq -r '.[] | select(.name == "${{ vars.SCALEWAY_CONTAINER_NAME || "devoirsfaits" }}") | .id')"
          if [ -z "$CONTAINER_ID" ] || [ "$CONTAINER_ID" = "null" ]; then
            echo "Container '${{ vars.SCALEWAY_CONTAINER_NAME || 'devoirsfaits' }}' introuvable" >&2
            exit 1
          fi
          scw container container deploy "$CONTAINER_ID" wait
