<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ exercice.titre }} — exo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#17402e">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="exo">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="/static/styles.css?v=4">
</head>
<body>
<div class="app">
  <main class="msgs" id="msgs" aria-live="polite">
    <div class="seg" id="seg" role="img" hidden></div>
    <section class="stmt open" id="stmt" hidden>
      <span class="lbl">ÉNONCÉ</span>
      <div class="t" id="stmtText"></div>
      <button class="ib sm" id="stmtToggle" aria-expanded="true" aria-label="Replier l'énoncé"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </section>
  </main>

  <div class="quick">
    <button class="qr h" id="hint"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Un indice</button>
    <button class="qr" data-say="Je suis bloqué à une étape.">Je suis bloqué</button>
  </div>

  <div class="comp">
    <div class="att" id="att" hidden><img id="attImg" alt="Photo jointe"><button class="x" id="attX" aria-label="Retirer la photo"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="box">
      <button class="ib" id="photo" aria-label="Ajouter une photo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="input" rows="1" aria-label="Ta réponse" placeholder="Écris ta réponse…"></textarea>
      <button class="send" id="send" aria-label="Envoyer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
  <button class="fab" id="quit" aria-label="Quitter l'exercice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
</div>

<script>window.EXO_CONTEXT = {{ exo_context | tojson }};</script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="/static/app.js?v=4"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
