<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>exo — Connexion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#17402e">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1411">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="exo">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="center-body">
<main class="card">
  <div class="logo">🧭</div>
  <h1>exo</h1>
  <p class="subtitle">Ton assistant pour t'aider sur les exercices.</p>
  {% if exercice_titre %}<p class="hint">Exercice : <strong>{{ exercice_titre }}</strong></p>{% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="login">Identifiant</label>
    <input type="text" id="login" name="login_name" autocomplete="username" required autofocus>
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Se connecter</button>
  </form>
</main>
</body>
</html>
